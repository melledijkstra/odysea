id: health-reminder
name: Health Reminder
trigger:
  type: active_time
  duration: 2700 # 45 minutes
  resetLimit: 600 # 10 minutes
steps:
  - id: notifyStep
    action: system.notify
    args:
      title: 'Health Check-in'
      message: "It's time for your check-in! Stay hydrated and take a quick stretch."
