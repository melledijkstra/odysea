packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: true
  deno: false
  esbuild: true
  sqlite3: true

ignoredBuiltDependencies:
  - deno

minimumReleaseAgeStrict: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sqlite3

catalog:
  # Building & Bundling
  turbo: ^2.10.11
  vite: ^8.2.1
  tsx: ^4.23.12
  tsdown: ^0.22.14
  deno: ^2.9.5

  # UI related
  '@mdi/js': ^7.4.47
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  svelte: ^5.56.10
  svelte-check: ^4.7.6
  tailwindcss: ^4.3.3
  tailwind-animations: ^1.0.2
  bits-ui: ^2.18.2

  # Linting & Formatting
  eslint: ^10.8.1
  prettier: ^3.9.6
  prettier-plugin-svelte: ^4.1.1
  prettier-plugin-tailwindcss: ^0.8.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-turbo: ^2.10.11

  # Testing
  vitest: ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
  playwright: ^1.62.1

  # Extension
  webextension-polyfill: ^0.12.0
  '@types/chrome': ^0.1.43
  '@types/webextension-polyfill': ^0.12.5

  # Storybook
  storybook: ^10.5.9
  '@storybook/addon-svelte-csf': ^5.1.2
  '@storybook/svelte': ^10.5.9
  '@storybook/svelte-vite': ^10.5.9

  # Vite Plugins
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  '@tailwindcss/vite': ^4.3.3

  # Other (uncategorized)
  '@tsconfig/svelte': ^5.0.8
  'dotenv': ^17.4.2
  typescript: ^6.0.3
  '@types/node': ^25.9.5
