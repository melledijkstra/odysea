packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: true
  deno: false
  esbuild: true
  sqlite3: true

ignoredBuiltDependencies:
  - deno

minimumReleaseAgeStrict: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sqlite3

catalog:
  # Building & Bundling
  turbo: ^2.11.6
  vite: ^8.3.2
  tsx: ^4.23.15
  tsdown: ^0.22.14
  deno: ^2.9.6

  # UI related
  '@mdi/js': ^7.4.47
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  svelte: ^5.57.1
  svelte-check: ^4.7.6
  tailwindcss: ^4.3.3
  tailwind-animations: ^1.0.2
  bits-ui: ^2.19.4

  # Linting & Formatting
  eslint: ^10.11.0
  prettier: ^3.9.9
  prettier-plugin-svelte: ^4.1.1
  prettier-plugin-tailwindcss: ^0.8.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-turbo: ^2.11.6

  # Testing
  vitest: ^5.0.3
  '@vitest/coverage-v8': ^5.0.3
  playwright: ^1.63.0

  # Extension
  webextension-polyfill: ^0.12.0
  '@types/chrome': ^0.2.9
  '@types/webextension-polyfill': ^0.12.6

  # Storybook
  storybook: ^10.6.1
  '@storybook/addon-svelte-csf': ^5.1.5
  '@storybook/svelte': ^10.6.1
  '@storybook/svelte-vite': ^10.6.1

  # Vite Plugins
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@tailwindcss/vite': ^4.3.3

  # Other (uncategorized)
  '@tsconfig/svelte': ^5.0.8
  'dotenv': ^17.4.2
  typescript: ^6.0.3
  '@types/node': ^25.9.8
