opencollection: 1.0.0

info:
  name: Odysea Serverless
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''

request:
  variables:
    - name: host
      value: https://odysea.melledijkstra.deno.net
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
