runtime:
  scripts:
    - type: before-request
      code: |-
        const queryString = req.getQueryString();
        const params = {};

        if (queryString) {
          queryString.split('&').forEach(pair => {
            const [key, value] = pair.split('=');
            if (key) {
              params[decodeURIComponent(key)] = value ? decodeURIComponent(value) : '';
            }
          });
        }

        // Access the resulting object
        console.log(params);

        const acceptedScopes = params['scope'].split(' ');
        console.log('Accepted scopes', acceptedScopes);

        if (params['code']) {
          bru.setVar('auth_code', params['code'])
          console.log('✅ Auth code received and set in variables')
        } else {
          console.log('NO AUTH CODE RECEIVED')
          console.log('Check the pasted URL and the authentication flow')
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Result URL Query Param Fields

  - **client_id:** The client ID obtained from the Cloud Console Clients page.
  - **client_secret:**	Optional The client secret obtained from the Cloud Console Clients page.
  - **code:**	The authorization code returned from the initial request.
  - **grant_type:** As defined in the OAuth 2.0 specification, this field's value must be set to authorization_code.
  - **redirect_uri:**	One of the redirect URIs listed for your project in the Cloud Console Clients page for the given client_id.
