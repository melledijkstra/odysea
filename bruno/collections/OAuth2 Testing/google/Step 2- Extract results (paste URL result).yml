    - name: code
      value: 4/0ATsMZqAOVv6r3a9W1uezB4HWMvjz1EVhmbYYeEMIK3FGtliemqxGRypB31YGDe8t7BNJaw
      type: query
    - name: scope
      value: email%20profile%20https://www.googleapis.com/auth/drive.metadata.readonly%20https://www.googleapis.com/auth/calendar.readonly%20https://www.googleapis.com/auth/googlehealth.sleep.readonly%20https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly%20https://www.googleapis.com/auth/tasks%20https://www.googleapis.com/auth/userinfo.profile%20https://www.googleapis.com/auth/userinfo.email%20openid
