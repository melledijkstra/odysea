info:
  name: 'Step 4.1: Call Protected API (calendar)'
  type: http
  seq: 10

http:
  method: GET
  url: https://www.googleapis.com/calendar/v3/calendars/primary
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
