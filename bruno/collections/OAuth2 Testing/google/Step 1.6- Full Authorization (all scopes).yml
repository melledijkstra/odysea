info:
  name: 'Step 1.6: Full Authorization (all scopes)'
  type: http
  seq: 6

http:
  method: GET
  url: https://accounts.google.com/o/oauth2/v2/auth?client_id={{process.env.GOOGLE_CLIENT_ID_BROWSER}}&redirect_uri={{redirectUrl}}&response_type=code&scope={{initialScopes}} https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly https://www.googleapis.com/auth/googlehealth.sleep.readonly https://www.googleapis.com/auth/tasks&access_type=offline&prompt=consent
  params:
    - name: client_id
      value: '{{process.env.GOOGLE_CLIENT_ID_BROWSER}}'
      type: query
      description: ID identifying your application
    - name: redirect_uri
      value: '{{redirectUrl}}'
      type: query
      description: |-
        Determines where the API server redirects the user after the user completes the authorization flow. The value must exactly match one of the authorized redirect URIs for the OAuth 2.0 client, which you configured in your client's Cloud Console Clients page. If this value doesn't match an authorized redirect URI for the provided client_id you will get a redirect_uri_mismatch error.
        Note that the http or https scheme, case, and trailing slash ('/') must all match.
    - name: response_type
      value: code
      type: query
    - name: scope
      value: '{{initialScopes}} https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly https://www.googleapis.com/auth/googlehealth.sleep.readonly https://www.googleapis.com/auth/tasks'
      type: query
    - name: access_type
      value: offline
      type: query
    - name: prompt
      value: consent
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log('open this URL in the browser: ', req.url)
        console.log('Go through the authentication flow...')
        console.log('Then paste the resulting URL in the next step')

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
