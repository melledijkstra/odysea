info:
  name: 'Step 1: Authorization (browser step)'
  type: http
  seq: 1

http:
  method: GET
  url: https://github.com/login/oauth/authorize?client_id={{process.env.GITHUB_CLIENT_ID}}&redirect_uri={{redirectUrl}}&scope=repo&allow_signup=false
  params:
    - name: client_id
      value: '{{process.env.GITHUB_CLIENT_ID}}'
      type: query
    - name: redirect_uri
      value: '{{redirectUrl}}'
      type: query
    - name: login
      value: ''
      type: query
      disabled: true
    - name: scope
      value: repo
      type: query
    - name: allow_signup
      value: 'false'
      type: query
    - name: prompt
      value: ''
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log('open this URL in the browser: ', req.url)
        console.log('Go through the authentication flow...')
        console.log('Then paste the resulting URL in the next step')

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
